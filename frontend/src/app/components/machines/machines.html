<div class="machines-container">
    <h1>Machines Management</h1>

    <!-- Error Message -->
    <div *ngIf="error" class="error-message">
        {{ error }}
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="loading">
        Loading machines...
    </div>

    <!-- Machines List -->
    <div *ngIf="!loading && machines.length > 0" class="machines-list">
        <table>
            <thead>
                <tr>
                    <th>Machine Name</th>
                    <th>Type</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let machine of machines">
                    <td>{{ machine.machineName }}</td>
                    <td>{{ machine.machineType || '-' }}</td>
                    <td>{{ machine.location || '-' }}</td>
                    <td>
                        <span [ngClass]="'status-' + machine.statusName.toLowerCase()">
                            {{ machine.statusName }}
                        </span>
                    </td>
                    <td>
                        <button (click)="editMachine(machine)" class="btn-edit">Edit</button>
                        <button (click)="deleteMachine(machine.machineId)" class="btn-delete">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && machines.length === 0" class="empty-state">
        <p>No machines found</p>
    </div>

    <!-- Add Machine Button -->
    <button *ngIf="!showForm" (click)="openForm()" class="btn-add">Add Machine</button>

    <!-- Form -->
    <div *ngIf="showForm" class="machine-form">
        <h2>{{ editingId ? 'Edit Machine' : 'Add New Machine' }}</h2>

        <div class="form-group">
            <label for="machineName">Machine Name *</label>
            <input type="text" id="machineName" [(ngModel)]="formData.machineName" placeholder="Enter machine name" />
        </div>

        <div class="form-group">
            <label for="machineType">Machine Type</label>
            <input type="text" id="machineType" [(ngModel)]="formData.machineType"
                placeholder="e.g., CNC, Conveyor, Robot" />
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" [(ngModel)]="formData.location" placeholder="e.g., Zone 1" />
        </div>

        <div class="form-group">
            <label for="statusId">Status *</label>
            <select id="statusId" [(ngModel)]="formData.statusId">
                <option *ngFor="let status of machineStatuses" [value]="status.id">
                    {{ status.name }}
                </option>
            </select>
        </div>

        <div class="form-actions">
            <button (click)="saveMachine()" class="btn-save">Save</button>
            <button (click)="closeForm()" class="btn-cancel">Cancel</button>
        </div>
    </div>
</div>
