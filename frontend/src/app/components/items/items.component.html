<div class="items-container">
    <h2>Items Management</h2>

    <!-- Add/Edit Form -->
    <div class="form-container">
        <h3>{{ editingId ? 'Edit Item' : 'Add New Item' }}</h3>
        <div class="form-group">
            <input type="text" [(ngModel)]="newItem.name" placeholder="Item Name" class="input-field" />
        </div>
        <div class="form-group">
            <textarea [(ngModel)]="newItem.description" placeholder="Description" class="input-field"></textarea>
        </div>
        <div class="button-group">
            <button (click)="editingId ? updateItem() : addItem()" class="btn btn-primary">
                {{ editingId ? 'Update' : 'Add' }} Item
            </button>
            <button *ngIf="editingId" (click)="cancel()" class="btn btn-secondary">
                Cancel
            </button>
        </div>
    </div>

    <!-- Items List -->
    <div class="items-list">
        <h3>Items List</h3>
        <div *ngIf="items.length === 0" class="no-items">
            No items found
        </div>
        <div *ngFor="let item of items" class="item-card">
            <div class="item-header">
                <h4>{{ item.name }}</h4>
            </div>
            <p class="item-description">{{ item.description }}</p>
            <div class="item-actions">
                <button (click)="editItem(item)" class="btn btn-edit">Edit</button>
                <button (click)="deleteItem(item.id)" class="btn btn-delete">Delete</button>
            </div>
        </div>
    </div>
</div>
